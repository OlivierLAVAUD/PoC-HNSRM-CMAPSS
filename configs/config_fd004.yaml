# configs/config_fd004.yaml
# FD004 overlay: inherits configs/config.yaml and overrides only what differs.
# Six operating conditions and two fault modes, the most heterogeneous subset.

extends: config.yaml

dataset:
  id: "FD004"
  name: "NASA C-MAPSS FD004"
  operating_conditions: 6

model:
  feature_names:
    - s2
    - s3
    - s4
    - s7
    - s8
    - s9
    - s11
    - s12
    - s13
    - s14
    - s15
    - s17
    - s20
    - s21
  input_shape: [30, 14]
  cnn_lstm:
    input_shape: [30, 14]

training:
  rul_threshold: 30

paths:
  data_file: 'data/raw/CMAPSS/FD004_processed.parquet'
  test_file: 'data/raw/CMAPSS/test_FD004.txt'
  rul_file: 'data/raw/CMAPSS/RUL_FD004.txt'
  results_dir: 'results/fd004'
