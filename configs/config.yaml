# configs/config.yaml

# ===============================
# Model Configuration
# ===============================
model:
  window_size: 30
  feature_names:
    - s2
    - s3
    - s4
    - s7
    - s8
    - s9
    - s11
    - s12
    - s13
    - s14
    - s15
    - s17
    - s20
    - s21
  input_shape: [30, 14]
  # Explicit architecture. The legacy "light_classifier" alias is still accepted.
  architecture: "random_forest"
  random_state: 42
  light_classifier:
    n_estimators: 100
    max_depth: 10
    class_weight: "balanced"
  # Complementary gradient-boosting architecture. Select it with
  # model.architecture: "lightgbm" or `python main.py --architecture lightgbm`.
  lightgbm:
    n_estimators: 350
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 0.0
    class_weight: "balanced"

# Sequential CNN-LSTM + Attention architecture. Select with
# model.architecture: "cnn_lstm" or `python main.py --architecture cnn_lstm`.
# Requires TensorFlow.
  cnn_lstm:
    input_shape: [30, 14]
    learning_rate: 0.001
    use_attention: true
    attention_key_dim: 50
    attention_heads: 4
    cnn_filters: 64
    cnn_kernel_size: 3
    lstm_units: 64
    dropout: 0.2
    epochs: 30
    batch_size: 32
    patience: 5

# Knowledge graph (optional, requires networkx + matplotlib). Disabled by
# default; enable with knowledge_graph.enabled: true to render
# results/knowledge_graph.png for each run.
knowledge_graph:
  enabled: false

# ===============================
# Probability Calibration
# ===============================
calibration:
  enabled: true
  method: "auto"          # auto | sigmoid | isotonic (auto uses validation Brier)
  cv_folds: 5
  n_bins: 10

# ===============================
# Decision Threshold
# ===============================
thresholding:
  strategy: "recall_at_precision"  # f1 | recall_at_precision | fbeta
  min_precision: 0.75              # validation constraint for recall_at_precision
  beta: 2.0                        # only used by fbeta
  fallback: 0.5

# ===============================
# Training Configuration
# ===============================
# FD001 protocol: train_fraction and validation_split select whole engines;
# the remaining engines are held out. When paths.test_file is configured it
# supplies the official test engines (20% train / 20% validation / 100 test).
training:
  train_fraction: 0.2
  validation_split: 0.2
  test_split: 0.1              # legacy synthetic path only
  rul_threshold: 30            # positive class: end-of-window RUL <= this value
  random_state: 42

# ===============================
# Human-in-the-Loop Configuration
# ===============================
hitl:
  enabled: true
  # The uncertainty band can follow the validation-selected threshold.
  center_on_threshold: true
  uncertainty_margin: 0.10
  uncertain_low: 0.4       # used when center_on_threshold is false
  uncertain_high: 0.6
  max_cases: 200
  sample_per_bucket: 300
  rule_validation:
    enabled: true
    min_precision: 0.9
    min_support: 5
    max_false_positive_rate: 0.05
    apply: true

# ===============================
# Path Configuration
# ===============================
paths:
  data_file: 'data/raw/CMAPSS/FD001_processed.parquet'
  test_file: 'data/raw/CMAPSS/test_FD001.txt'
  rul_file: 'data/raw/CMAPSS/RUL_FD001.txt'
  results_dir: 'results'
  plot_config_path: 'plot_config.yaml'
  reasoning_rules_path: 'src/reasoning/rules.pl'

# ===============================
# Symbolic Reasoning Configuration
# ===============================
symbolic_reasoning:
  # Gates the Prolog layer in the FD001 pipeline. When false, temporal rules,
  # learned-rule validation, symbolic fusion signals and rule-conflict HITL
  # reasons are skipped (fusion then uses zero symbolic/ProbLog signals).
  enabled: true
  extraction_threshold: 0.6
  min_confidence: 0.7
  max_rules: 100
  pruning_strategy: 'confidence'

# ===============================
# ProbLog Learned-Rule Injection
# ===============================
problog:
  learned_rule_weight: 0.15       # per active human rule
  max_active_learned_rules: 3     # cap on the learned noisy-or contribution

# ===============================
# Temporal Symbolic Reasoning
# ===============================
temporal:
  enabled: true
  percentile: 75.0                # training-only threshold percentile
  moving_average_cycles: 5

# ===============================
# Explicit Temporal Features (LightGBM)
# ===============================
features:
  temporal:
    enabled: true
    include_raw_window: true
    moving_average_cycles: 5
    percentile_low: 25.0
    percentile_high: 75.0
    apply_to_architectures: ["lightgbm"]

# ===============================
# Controlled Model Comparison
# ===============================
experiments:
  compare_models:
    enabled: false                 # enable with `python main.py --compare-models`
    models: ["random_forest", "lightgbm"]
    selection_metric: "fbeta"      # f1 | fbeta | recall | average_precision | roc_auc
    beta: 2.0
    selection_split: validation
  # Re-run the whole protocol over several train/validation splits of the
  # training engines. The official test engines stay untouched. Enable with
  # `python main.py --multi-seed --seeds 42,43,44,45,46`.
  multi_seed:
    enabled: false
    seeds: [42, 43, 44, 45, 46]
    selection_metric: "fbeta"
    beta: 2.0

# ===============================
# Threshold Sensitivity Analysis
# ===============================
threshold_sensitivity:
  enabled: false                 # enable with `python main.py --threshold-sensitivity`
  min_precision_values: [0.65, 0.70, 0.75, 0.80, 0.85]
  beta_values: [1.0, 1.5, 2.0, 3.0]
  strategies: ["recall_at_precision", "fbeta", "f1"]

# ===============================
# Operational Alert Policy
# ===============================
# Expected maintenance cost per alert mode. The mode is selected on validation
# only; the official test split is reported for information.
operational_policy:
  enabled: false                 # enable with `python main.py --operational-policy`
  false_negative_cost: 10.0
  false_alarm_cost: 1.0
  inspection_capacity_per_cycle: null   # max inspections per engine-cycle
  selection_metric: "expected_cost"      # expected_cost | fbeta | recall
  preferred_alert_mode: null             # immediate | consecutive_2 | ...

# ===============================
# Alert Confirmation and Smoothing
# ===============================
alerting:
  enabled: true
  consecutive_ks: [2, 3]
  smoothing_cycles: 3

# ===============================
# Auxiliary RUL Regression
# ===============================
rul_regression:
  enabled: true
  apply_to_architectures: ["lightgbm"]
  use_as_classifier_feature: true
  cv_folds: 5
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_child_samples: 20
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 0.0

# ===============================
# Validation-only Probability Fusion
# ===============================
fusion:
  enabled: true
  apply_to_architectures: ["lightgbm"]
  threshold_strategy: "recall_at_precision"
  min_precision: 0.75
  beta: 2.0
  fallback: 0.5
  features: ["neural_probability", "symbolic_rule_score",
             "problog_failure_risk", "predicted_rul"]
  # Robustness check of the production fusion: grouped cross-validation over
  # the validation engines (never the official test engines). Diagnostics only.
  validation:
    enabled: true
    method: "group_kfold"         # group_kfold | repeated_kfold
    n_splits: 5
    n_repeats: 1
    random_state: 42

# ===============================
# Monitoring
# ===============================
# Compare incoming windows with training statistics. A critical drift never
# blocks inference: it warns and suggests routing windows to the HITL queue.
monitoring:
  drift:
    enabled: true
    warning_threshold: 0.05       # share of incoming values outside training bounds
    critical_threshold: 0.15
    min_windows: 30

# ===============================
# Decision Audit Trail
# ===============================
# One JSONL record per decided window, with artifact hashes and signals.
# Verify a run with `python -m src.utils.audit --results results`.
audit:
  enabled: true
  max_records: 12000            # cap on written decisions (0 = no cap)
  include_insights: 25          # symbolic insights kept for the riskiest windows

# ===============================
# Engine-level Evaluation
# ===============================
engine_metrics:
  enabled: true

# ===============================
# Legacy modules
# ===============================
# src/data/data_loader.py and src/integration/adaptive_controller.py belong to
# the synthetic demonstration and are not part of the FD001 pipeline.
legacy:
  enabled: false

# ===============================
# Input Data Quality
# ===============================
preprocessing:
  non_finite_policy: zero        # zero | error
