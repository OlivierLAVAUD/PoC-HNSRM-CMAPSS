# configs/config.yaml

# ===============================
# Model Configuration
# ===============================
model:
  window_size: 30
  feature_names:
    - s2
    - s3
    - s4
    - s7
    - s8
    - s9
    - s11
    - s12
    - s13
    - s14
    - s15
    - s17
    - s20
    - s21
  input_shape: [30, 14]
  # Explicit architecture. The legacy "light_classifier" alias is still accepted.
  architecture: "random_forest"
  random_state: 42
  light_classifier:
    n_estimators: 100
    max_depth: 10
    class_weight: "balanced"
  # Complementary gradient-boosting architecture. Select it with
  # model.architecture: "lightgbm" or `python main.py --architecture lightgbm`.
  lightgbm:
    n_estimators: 350
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 0.0
    class_weight: "balanced"

# ===============================
# Probability Calibration
# ===============================
calibration:
  enabled: true
  method: "auto"          # auto | sigmoid | isotonic (auto uses validation Brier)
  cv_folds: 5
  n_bins: 10

# ===============================
# Decision Threshold
# ===============================
thresholding:
  strategy: "recall_at_precision"  # f1 | recall_at_precision | fbeta
  min_precision: 0.75              # validation constraint for recall_at_precision
  beta: 2.0                        # only used by fbeta
  fallback: 0.5

# ===============================
# Training Configuration
# ===============================
training:
  train_fraction: 0.2
  validation_split: 0.2
  test_split: 0.1
  random_state: 42

# ===============================
# Human-in-the-Loop Configuration
# ===============================
hitl:
  enabled: true
  # The uncertainty band can follow the validation-selected threshold.
  center_on_threshold: true
  uncertainty_margin: 0.10
  uncertain_low: 0.4       # used when center_on_threshold is false
  uncertain_high: 0.6
  max_cases: 200
  sample_per_bucket: 300
  rule_validation:
    enabled: true
    min_precision: 0.9
    min_support: 5
    max_false_positive_rate: 0.05
    apply: true

# ===============================
# Path Configuration
# ===============================
paths:
  data_file: 'data/raw/CMAPSS/FD001_processed.parquet'
  test_file: 'data/raw/CMAPSS/test_FD001.txt'
  rul_file: 'data/raw/CMAPSS/RUL_FD001.txt'
  results_dir: 'results'
  plot_config_path: 'plot_config.yaml'
  reasoning_rules_path: 'src/reasoning/rules.pl'

# ===============================
# Symbolic Reasoning Configuration
# ===============================
symbolic_reasoning:
  enabled: true
  extraction_threshold: 0.6
  min_confidence: 0.7
  max_rules: 100
  pruning_strategy: 'confidence'

# ===============================
# ProbLog Learned-Rule Injection
# ===============================
problog:
  learned_rule_weight: 0.15       # per active human rule
  max_active_learned_rules: 3     # cap on the learned noisy-or contribution

# ===============================
# Temporal Symbolic Reasoning
# ===============================
temporal:
  enabled: true
  percentile: 75.0                # training-only threshold percentile
  moving_average_cycles: 5

# ===============================
# Explicit Temporal Features (LightGBM)
# ===============================
features:
  temporal:
    enabled: true
    include_raw_window: true
    moving_average_cycles: 5
    percentile_low: 25.0
    percentile_high: 75.0
    apply_to_architectures: ["lightgbm"]

# ===============================
# Controlled Model Comparison
# ===============================
experiments:
  compare_models:
    enabled: false                 # enable with `python main.py --compare-models`
    models: ["random_forest", "lightgbm"]
    selection_metric: "fbeta"      # f1 | fbeta | recall | average_precision | roc_auc
    beta: 2.0
    selection_split: validation

# ===============================
# Alert Confirmation and Smoothing
# ===============================
alerting:
  enabled: true
  consecutive_ks: [2, 3]
  smoothing_cycles: 3

# ===============================
# Auxiliary RUL Regression
# ===============================
rul_regression:
  enabled: true
  apply_to_architectures: ["lightgbm"]
  use_as_classifier_feature: true
  cv_folds: 5
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_child_samples: 20
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 0.0

# ===============================
# Validation-only Probability Fusion
# ===============================
fusion:
  enabled: true
  apply_to_architectures: ["lightgbm"]
  threshold_strategy: "recall_at_precision"
  min_precision: 0.75
  beta: 2.0
  fallback: 0.5
  features: ["neural_probability", "symbolic_rule_score",
             "problog_failure_risk", "predicted_rul"]

# ===============================
# Engine-level Evaluation
# ===============================
engine_metrics:
  enabled: true

# ===============================
# Input Data Quality
# ===============================
preprocessing:
  non_finite_policy: zero        # zero | error
